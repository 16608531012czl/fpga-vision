<rect x="48" y="723" width="1504" height="139" rx="18" fill="#FFF8EB" stroke="#EAD6AC" stroke-width="2"/>
<text x="77" y="745" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#805818">供电条件：本图适用于允许 3.3 V 输入的 GY-302 模块。</text>
<text x="77" y="794" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#805818">你提供的模块带稳压器；3.3 V 输入时，需确认芯片端供电仍为 2.4～3.6 V。</text>
<text x="65" y="887" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#58687C">断电接线，按丝印找脚。此图为逻辑连线，不表示实物接口的朝向与排列。</text>
