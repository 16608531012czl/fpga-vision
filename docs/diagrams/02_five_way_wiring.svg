<text x="1210" y="658" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#58687C">1× / 2× / 4×</text>
<polyline points="936,753 1025,753" fill="none" stroke="#8995A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<circle cx="1025" cy="753" r="8" fill="white" stroke="#8995A3" stroke-width="2"/>
<polyline points="925,743 945,763" fill="none" stroke="#8995A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="925,763 945,743" fill="none" stroke="#8995A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1055" y="734" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#8995A3">SET</text>
<text x="1210" y="738" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#8995A3">留空，不接</text>
<polyline points="936,823 1025,823" fill="none" stroke="#8995A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<circle cx="1025" cy="823" r="8" fill="white" stroke="#8995A3" stroke-width="2"/>
<polyline points="925,813 945,833" fill="none" stroke="#8995A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="925,833 945,813" fill="none" stroke="#8995A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1055" y="804" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#8995A3">RST</text>
<text x="1210" y="808" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#8995A3">留空，不接</text>
<text x="111" y="755" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#172A42">只接 COM 与五路按键信号，共六根线。</text>
<text x="111" y="804" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#58687C">J7 的两个 GND 在开发板内部相通。</text>
<rect x="48" y="918" width="1504" height="100" rx="18" fill="#EDF4FE" stroke="#C7D9F4" stroke-width="2"/>
<text x="77" y="938" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172A42">COM 接地，无源按键不接 3.3 V / 5 V；RST 不接开发板的复位接口。</text>
<text x="77" y="979" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#58687C">D3～D7 指 Arduino 接口丝印；工程已启用内部上拉，按下为低电平。</text>
<text x="65" y="1043" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#58687C">断电接线。J4 第 4 脚与 40 针接口第 4 脚不同；本图不是实物针脚方位图。</text>
</svg>