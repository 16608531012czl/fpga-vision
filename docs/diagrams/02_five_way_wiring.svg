<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090">
<title>八针五向导航按键接线图</title>
<desc>按 visual_aid_v3 当前工程分配及 PYNQ-Z2 厂家手册绘制。逻辑连线图，非实物针脚方位图。</desc>
<rect width="1600" height="1090" fill="#F4F7FB"/>
<text x="64" y="38" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" fill="#172A42">② 五向导航按键接线图</text>
<text x="66" y="101" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#58687C">适用于你提供的 COM / UP / DWN / LFT / RHT / MID / SET / RST 八针模块</text>
<rect x="48" y="160" width="1504" height="736" rx="18" fill="white" stroke="#D8E1EB" stroke-width="2"/>
<rect x="78" y="231" width="552" height="484" rx="18" fill="#F8FAFD" stroke="#D8E1EB" stroke-width="2"/>
<rect x="1000" y="231" width="520" height="633" rx="18" fill="#F3F1FA" stroke="#DCD3ED" stroke-width="2"/>
