<text x="112" y="655" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#27865D">D7</text>
<text x="298" y="657" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#58687C">J4 第 8 脚</text>
<polyline points="610,673 1025,673" fill="none" stroke="#27865D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
